services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tenantflow}
      POSTGRES_USER: ${POSTGRES_USER:-tenantflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - tenantflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tenantflow}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tenantflow}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TENANTFLOW_NORTHWIND_PASSWORD: ${NORTHWIND_PASSWORD:?Set NORTHWIND_PASSWORD in .env}
      TENANTFLOW_CONTOSO_PASSWORD: ${CONTOSO_PASSWORD:?Set CONTOSO_PASSWORD in .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  tenantflow-data:
